name: Propose LINE CLI formula update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Formula/line-cli.rb'
      - 'scripts/**'
      - '.github/workflows/update-line-cli.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: ruby -c Formula/line-cli.rb

  propose:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tap PR token
        id: pr_token
        env:
          TAP_PR_TOKEN: ${{ secrets.TAP_PR_TOKEN }}
        run: |
          if [ -n "$TAP_PR_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Add the TAP_PR_TOKEN repository secret to enable formula update PRs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify release assets and update formula
        if: steps.pr_token.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_formula.py
      - if: steps.pr_token.outputs.ready == 'true'
        run: ruby -c Formula/line-cli.rb
      - if: steps.pr_token.outputs.ready == 'true'
        run: git diff --check
      - name: Open or update formula PR
        if: steps.pr_token.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.TAP_PR_TOKEN }}
          branch: feat/update-line-cli-formula
          delete-branch: true
          add-paths: Formula/line-cli.rb
          commit-message: 'chore: update LINE CLI formula'
          title: 'chore: update LINE CLI formula'
          body: |
            The latest stable LINE CLI release is available in this tap.

            The updater verified both macOS archive sizes and SHA-256 digests against the release checksum manifest. Review and merge this PR to publish the formula update.
